<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trippy Light Show</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.1s;
        }

        #trippyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .message {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="trippyCanvas"></canvas>
    <div class="message" id="message">TRIPPY MODE</div>

    <script>
        const canvas = document.getElementById('trippyCanvas');
        const ctx = canvas.getContext('2d');
        let audioContext, analyser, dataArray, bufferLength;
        let rotation = 0;
        let rotation2 = 0;
        let rotation3 = 0;
        let time = 0;
        let targetRotationSpeed = 0.02;
        let currentRotationSpeed = 0.02;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Setup audio
        async function setupAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);

                analyser.fftSize = 256; // Smaller for better performance
                analyser.smoothingTimeConstant = 0.85; // More fluid smoothing
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                source.connect(analyser);
                draw();
            } catch (err) {
                console.log('Microphone access denied');
            }
        }

        function draw() {
            requestAnimationFrame(draw);
            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);

            // Calculate audio properties
            const bass = dataArray.slice(0, bufferLength / 3).reduce((a, b) => a + b) / (bufferLength / 3);
            const mid = dataArray.slice(bufferLength / 3, 2 * bufferLength / 3).reduce((a, b) => a + b) / (bufferLength / 3);
            const treble = dataArray.slice(2 * bufferLength / 3).reduce((a, b) => a + b) / (bufferLength / 3);
            const average = dataArray.reduce((a, b) => a + b) / bufferLength;

            // Trailing effect with pulsing darkness
            const fadeAmount = 0.15 - (bass / 255) * 0.1; // Less fade on beats = more trails
            ctx.fillStyle = `rgba(0, 0, 0, ${fadeAmount})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Flash screen white on massive beats
            if (bass > 230) {
                ctx.fillStyle = `rgba(255, 255, 255, ${(bass - 230) / 255 * 0.3})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Smooth fluid rotation with multiple layers - MORE FLUID
            targetRotationSpeed = 0.02 + (bass / 255) * 0.3;
            currentRotationSpeed += (targetRotationSpeed - currentRotationSpeed) * 0.15; // More responsive smoothing

            rotation += currentRotationSpeed;
            rotation2 += currentRotationSpeed * 0.7 + Math.sin(time * 0.5) * 0.01; // Wave motion
            rotation3 += currentRotationSpeed * 1.3 + Math.cos(time * 0.3) * 0.01; // Faster counter
            time += 0.03;

            // Global pulse - entire scene breathes with the music
            const globalPulse = 1 + (bass / 255) * 0.3 + (average / 255) * 0.2;

            // Subtle wobble
            const wobbleX = Math.sin(time * 0.8) * 15 + Math.cos(time * 0.5) * 10;
            const wobbleY = Math.cos(time * 0.6) * 15 + Math.sin(time * 0.7) * 10;

            ctx.save();
            ctx.translate(centerX + wobbleX, centerY + wobbleY);
            ctx.scale(globalPulse, globalPulse); // Everything pulses

            // Draw multiple kaleidoscope layers with fluid rotation - MELDED
            const layers = 4;
            for (let layer = 0; layer < layers; layer++) {
                ctx.save();

                // Blend modes for melding effect
                const blendModes = ['screen', 'lighten', 'color-dodge', 'overlay'];
                ctx.globalCompositeOperation = blendModes[layer % blendModes.length];

                // Each layer rotates at different fluid speeds
                const layerRotation = layer % 3 === 0 ? rotation : (layer % 3 === 1 ? rotation2 : rotation3);
                const direction = layer % 2 === 0 ? 1 : -1;
                ctx.rotate(layerRotation * direction + Math.sin(time + layer) * 0.2);

                // Kaleidoscope effect - multiple symmetrical copies
                const symmetry = 8;
                for (let sym = 0; sym < symmetry; sym++) {
                    ctx.save();
                    ctx.rotate((Math.PI * 2 / symmetry) * sym);

                    // Draw spiral waveform that melts into others - MORE CENTERED
                    const step = 2;
                    ctx.beginPath();
                    for (let i = 0; i < bufferLength; i += step) {
                        const angle = (i / bufferLength) * Math.PI * 4 + rotation * 2;
                        const intensity = dataArray[i] / 255;
                        const radius = 50 + layer * 50 + intensity * 200; // More centered

                        const x = Math.cos(angle) * radius;
                        const y = Math.sin(angle) * radius;

                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }

                    const hue = (layer * 60 + time * 50 + sym * 30) % 360;
                    const alpha = 0.5 + (average / 255) * 0.5; // More transparent for blending
                    ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
                    ctx.lineWidth = 3 + (bass / 255) * 8;
                    ctx.shadowBlur = 20 + (average / 255) * 80; // More glow for melding
                    ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.8)`;
                    ctx.stroke();

                    ctx.restore();
                }

                ctx.globalCompositeOperation = 'source-over'; // Reset
                ctx.restore();
            }

            // Draw circular frequency spectrum - MORE CENTERED
            ctx.save();
            ctx.globalCompositeOperation = 'screen'; // Blend mode for melding
            ctx.rotate(rotation2);
            const circles = 2;
            const particleStep = 3;
            for (let circle = 0; circle < circles; circle++) {
                const baseRadius = 100 + circle * 60; // Closer to center

                for (let i = 0; i < bufferLength; i += particleStep) {
                    const angle = (i / bufferLength) * Math.PI * 2;
                    const intensity = dataArray[i] / 255;
                    const radius = baseRadius + intensity * 150; // Less spread

                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    const size = 3 + intensity * 20;

                    const hue = (i / bufferLength * 360 + time * 100 + circle * 120) % 360;

                    ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${0.6 + intensity * 0.4})`;
                    ctx.shadowBlur = 40 + intensity * 80; // More glow
                    ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`;

                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();

            // Draw geometric patterns - MORE CENTERED
            ctx.save();
            ctx.globalCompositeOperation = 'lighter'; // Blend for melding
            ctx.rotate(-rotation3 * 0.5);
            const shapes = 8;
            for (let s = 0; s < shapes; s++) {
                const angle = (s / shapes) * Math.PI * 2;
                const dist = 250 + Math.sin(time * 2 + s) * 60 + Math.cos(time * 1.5 + s) * 30; // Closer to center
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                const freq = s % 3 === 0 ? bass : (s % 3 === 1 ? mid : treble);
                const size = 30 + (freq / 255) * 150;
                const hue = (s * 45 + time * 100) % 360;

                const intensity = freq / 255;
                ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${0.4 + intensity * 0.4})`;
                ctx.shadowBlur = 40 + intensity * 90; // Massive glow for melding
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.9)`;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation2 * 2 + s + Math.sin(time * 2 + s) * 0.5);

                // Draw star shape
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const r = i % 2 === 0 ? size : size / 2;
                    const a = (i / 5) * Math.PI * 2;
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();

            // Draw tunneling rings - OPTIMIZED
            const ringCount = 12; // Reduced for performance
            for (let r = 0; r < ringCount; r++) {
                const progress = (r + time * 10) % ringCount / ringCount;
                const radius = progress * Math.min(canvas.width, canvas.height);
                const intensity = dataArray[Math.floor(progress * bufferLength)] / 255;
                const hue = (progress * 360 + time * 100) % 360;

                ctx.strokeStyle = `hsla(${hue}, 100%, 50%, ${0.3 + intensity * 0.4})`;
                ctx.lineWidth = 2 + intensity * 8;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.6)`;

                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();

            // Flash random obscure black & white images on beats
            if (bass > 180 && Math.random() > 0.7) {
                const imageType = Math.floor(Math.random() * 8);
                const imgX = Math.random() * canvas.width - canvas.width / 2;
                const imgY = Math.random() * canvas.height - canvas.height / 2;
                const imgSize = 100 + Math.random() * 200;
                const opacity = 0.3 + Math.random() * 0.4;

                ctx.save();

                // Random black or white
                const isWhite = Math.random() > 0.5;
                ctx.strokeStyle = isWhite ? `rgba(255,255,255,${opacity})` : `rgba(0,0,0,${opacity})`;
                ctx.fillStyle = isWhite ? `rgba(255,255,255,${opacity * 0.3})` : `rgba(0,0,0,${opacity * 0.3})`;
                ctx.lineWidth = 3;

                switch(imageType) {
                    case 0: // Vinyl record
                        ctx.beginPath();
                        ctx.arc(imgX, imgY, imgSize, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(imgX, imgY, imgSize * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                        // Grooves
                        for (let i = 0; i < 8; i++) {
                            ctx.beginPath();
                            ctx.arc(imgX, imgY, imgSize * (0.3 + i * 0.08), 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        break;

                    case 1: // Warped eye watching
                        ctx.beginPath();
                        ctx.ellipse(imgX, imgY, imgSize, imgSize * 0.6, rotation, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(imgX, imgY, imgSize * 0.3, 0, Math.PI * 2);
                        ctx.fill();
                        break;

                    case 2: // Cassette tape
                        ctx.strokeRect(imgX - imgSize, imgY - imgSize * 0.6, imgSize * 2, imgSize * 1.2);
                        ctx.beginPath();
                        ctx.arc(imgX - imgSize * 0.4, imgY, imgSize * 0.3, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(imgX + imgSize * 0.4, imgY, imgSize * 0.3, 0, Math.PI * 2);
                        ctx.stroke();
                        break;

                    case 3: // Abstract speaker cone
                        for (let i = 0; i < 6; i++) {
                            ctx.beginPath();
                            ctx.arc(imgX, imgY, imgSize * (0.2 + i * 0.15), 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        break;

                    case 4: // Waveform glitch
                        ctx.beginPath();
                        for (let i = 0; i < 50; i++) {
                            const x = imgX - imgSize + (i / 50) * imgSize * 2;
                            const y = imgY + Math.sin(i * 0.5) * imgSize * Math.random();
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                        break;

                    case 5: // Spiral/hypnotic disk
                        ctx.beginPath();
                        for (let angle = 0; angle < Math.PI * 8; angle += 0.1) {
                            const r = (angle / (Math.PI * 8)) * imgSize;
                            const x = imgX + Math.cos(angle) * r;
                            const y = imgY + Math.sin(angle) * r;
                            if (angle === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                        break;

                    case 6: // Fragmented face
                        // Eye
                        ctx.beginPath();
                        ctx.arc(imgX - imgSize * 0.3, imgY - imgSize * 0.2, imgSize * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(imgX + imgSize * 0.3, imgY - imgSize * 0.2, imgSize * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                        // Mouth
                        ctx.beginPath();
                        ctx.arc(imgX, imgY + imgSize * 0.3, imgSize * 0.5, 0, Math.PI, Math.random() > 0.5);
                        ctx.stroke();
                        break;

                    case 7: // Abstract frequency bars
                        for (let i = 0; i < 15; i++) {
                            const h = Math.random() * imgSize;
                            const x = imgX - imgSize + (i / 15) * imgSize * 2;
                            ctx.fillRect(x, imgY - h / 2, imgSize * 0.1, h);
                        }
                        break;
                }

                ctx.restore();
            }

            // Pulse message - MORE REACTIVE
            const message = document.getElementById('message');
            const scale = 1 + (bass / 255) * 0.8; // Bigger pulse
            const hue = (time * 100) % 360;
            message.style.transform = `translate(-50%, -50%) scale(${scale}) rotate(${Math.sin(time) * 10}deg)`;
            message.style.textShadow = `0 0 ${40 + bass * 2}px hsla(${hue}, 100%, 50%, 1)`;
            message.style.color = `hsla(${hue}, 100%, ${50 + (bass / 255) * 50}%, 1)`; // Brightness changes

            // Pulse body background on beats
            const bgIntensity = Math.floor((bass / 255) * 30);
            document.body.style.backgroundColor = `rgb(${bgIntensity}, ${bgIntensity}, ${bgIntensity})`;

            ctx.shadowBlur = 0;
        }

        // Check if launched from bash script (no_fullscreen parameter)
        const urlParams = new URLSearchParams(window.location.search);
        const skipFullscreen = urlParams.has('no_fullscreen');

        if (!skipFullscreen) {
            // If opened directly in browser, use fullscreen API
            setTimeout(() => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                }
            }, 2000);
        }

        // Delay audio setup to allow window positioning to complete
        // The bash script needs time to span the window across monitors
        setTimeout(() => {
            setupAudio();
        }, 3000);

        // Exit on ESC or Q
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'q' || e.key === 'Q') {
                if (skipFullscreen) {
                    window.close();
                } else if (document.fullscreenElement) {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
